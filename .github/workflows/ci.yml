name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The .NET 10 SDK on the runner image satisfies global.json; no download needed.
      - run: dotnet --version

      - run: dotnet build Benchmarks -c Release
      - run: dotnet build ReadToMemory -c Release
      - run: dotnet build Validate -c Release
